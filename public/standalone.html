<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Island Clicker — Standalone Build</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', system-ui, sans-serif;
            background: linear-gradient(180deg, #7dd3fc 0%, #e0f2fe 40%, #f0fdf4 100%);
            user-select: none;
            -webkit-user-select: none;
        }
        h1, h2, h3, .font-fun { font-family: 'Fredoka', cursive, sans-serif; }
        .btn-3d {
            transition: transform 0.08s ease;
        }
        .btn-3d:active {
            transform: translateY(3px);
        }
        .btn-amber {
            background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 5px 0 #b45309;
        }
        .btn-green {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
            box-shadow: 0 5px 0 #15803d;
        }
        .floating-num {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(1.3); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">
    <!-- Navbar -->
    <header class="bg-white/80 backdrop-blur-md border-b-2 border-sky-100 px-6 py-3 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🏝️</span>
                <span class="font-fun text-2xl font-black text-slate-900">City Island <span class="text-amber-500">Clicker</span></span>
                <span class="bg-amber-100 text-amber-900 text-xs font-black px-2 py-0.5 rounded-full ml-2">Standalone Build</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-amber-50 border-2 border-amber-200 px-4 py-1.5 rounded-2xl">
                    <span class="text-xl">🪙</span>
                    <div>
                        <div id="coinCount" class="font-black text-lg text-amber-900 leading-none">0</div>
                        <div id="incomeRate" class="text-[10px] font-bold text-amber-700 leading-none mt-0.5">+0/s</div>
                    </div>
                </div>
                <div class="flex items-center gap-2 bg-sky-50 border-2 border-sky-200 px-4 py-1.5 rounded-2xl">
                    <span class="text-xl">💎</span>
                    <span id="gemCount" class="font-black text-lg text-sky-900">50</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Game Grid -->
    <main class="max-w-6xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start my-auto">
        <!-- Island Center Stage -->
        <div class="lg:col-span-7 flex flex-col items-center justify-center">
            <!-- Combo Banner -->
            <div id="comboBanner" class="hidden mb-4 bg-gradient-to-r from-amber-500 to-red-500 text-white font-black px-5 py-1.5 rounded-full text-sm shadow-md animate-bounce">
                🔥 FRENZY COMBO: <span id="comboMult">x2</span> MULTIPLIER!
            </div>

            <!-- Island Button -->
            <div class="relative cursor-pointer select-none group" id="islandBtn">
                <div id="particlesContainer"></div>
                <svg viewBox="0 0 500 360" class="w-80 sm:w-96 md:w-[420px] transition-transform duration-100 group-hover:scale-102 group-active:scale-95 drop-shadow-2xl">
                    <defs>
                        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
                        <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#451a03"/></linearGradient>
                        <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
                    </defs>
                    <ellipse cx="250" cy="270" rx="210" ry="60" fill="#38bdf8" opacity="0.4"/>
                    <path d="M60,195 Q90,290 250,310 Q410,290 440,195 Q420,235 340,255 Q250,265 160,255 Q80,235 60,195 Z" fill="url(#cliff)"/>
                    <ellipse cx="250" cy="190" rx="195" ry="60" fill="url(#sand)"/>
                    <ellipse cx="250" cy="182" rx="175" ry="52" fill="url(#grass)"/>
                    <!-- Town Hall -->
                    <g transform="translate(215, 100)">
                        <rect x="10" y="55" width="50" height="35" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
                        <circle cx="35" cy="40" r="14" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
                        <polygon points="5,55 35,20 65,55" fill="#ef4444"/>
                        <polygon points="36,6 52,11 36,16" fill="#facc15"/>
                    </g>
                    <!-- Palm Trees -->
                    <g transform="translate(95, 140)"><circle cx="28" cy="8" r="14" fill="#15803d"/><circle cx="22" cy="12" r="10" fill="#16a34a"/></g>
                    <g transform="translate(365, 145)"><circle cx="2" cy="6" r="12" fill="#15803d"/><circle cx="8" cy="9" r="9" fill="#16a34a"/></g>
                </svg>
                <div class="mt-4 text-center">
                    <span class="inline-flex items-center gap-2 bg-gradient-to-r from-amber-500 to-yellow-400 text-amber-950 font-black px-6 py-2.5 rounded-full shadow-lg border-2 border-amber-200 group-hover:scale-105 transition-transform">
                        ⚡ TAP THE ISLAND! (<span id="tapGainLabel">+1</span>)
                    </span>
                </div>
            </div>
        </div>

        <!-- Upgrades Side Panel -->
        <div class="lg:col-span-5 bg-white/90 backdrop-blur-md rounded-3xl p-6 border-3 border-sky-100 shadow-xl">
            <div class="flex gap-2 bg-sky-100/70 p-1.5 rounded-2xl mb-4">
                <button id="tabPassive" class="flex-1 py-2.5 rounded-xl font-black text-sm bg-emerald-500 text-white shadow-md">City Buildings</button>
                <button id="tabClick" class="flex-1 py-2.5 rounded-xl font-black text-sm text-slate-600 hover:bg-white/60">Mayor Tools</button>
            </div>
            <div id="upgradesList" class="space-y-3 max-h-[460px] overflow-y-auto pr-1"></div>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-500 font-bold border-t border-sky-200 bg-white/50">
        City Island Clicker Standalone Build • Auto-saves to LocalStorage
    </footer>

    <script>
        // Sound synth via Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.4, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Upgrades catalog
        const UPGRADES = [
            { key: 'wooden_shovel', name: 'Wooden Shovel', category: 'click', baseCost: 15, mult: 1.15, power: 1, desc: 'Simple coastal tool for shoreline gold.' },
            { key: 'golden_trowel', name: 'Master Trowel', category: 'click', baseCost: 120, mult: 1.18, power: 4, desc: 'Crafted masonry tool for beachfront walkways.' },
            { key: 'electric_jackhammer', name: 'Electric Jackhammer', category: 'click', baseCost: 1100, mult: 1.20, power: 18, desc: 'Power drill to break open golden reef deposits.' },
            { key: 'excavator_prime', name: 'Excavator Prime', category: 'click', baseCost: 12000, mult: 1.22, power: 85, desc: 'Heavy machinery turning sand into gold mountains.' },
            { key: 'island_scout', name: 'Island Scout', category: 'passive', baseCost: 50, mult: 1.15, power: 1, desc: 'Beachcomber foraging forgotten tourist coins.' },
            { key: 'lumberjack_camp', name: 'Lumberjack Camp', category: 'passive', baseCost: 280, mult: 1.15, power: 5, desc: 'Supplies timber to build residential districts.' },
            { key: 'fishing_dock', name: "Fisherman's Harbor", category: 'passive', baseCost: 1200, mult: 1.16, power: 22, desc: 'Fresh seafood trade and deep-sea pearls.' },
            { key: 'wind_turbine', name: 'Breeze Wind Farm', category: 'passive', baseCost: 6500, mult: 1.16, power: 90, desc: 'Clean oceanic energy powering the metropolis.' },
            { key: 'tourist_hotel', name: 'Grand Lagoon Resort', category: 'passive', baseCost: 35000, mult: 1.17, power: 380, desc: '5-star beachfront suites with infinity pools.' },
            { key: 'island_bank', name: 'Archipelago Central Bank', category: 'passive', baseCost: 200000, mult: 1.18, power: 1650, desc: 'Investment holdings generating massive returns.' }
        ];

        let state = JSON.parse(localStorage.getItem('city_island_standalone')) || {
            coins: 100,
            gems: 50,
            levels: {}
        };

        let currentTab = 'passive';
        let comboCount = 0;
        let comboMult = 1;
        let comboTimer = null;

        function getLevel(key) { return state.levels[key] || 0; }
        function getCost(u) { return Math.round(u.baseCost * Math.pow(u.mult, getLevel(u.key))); }
        function getTapPower() {
            let p = 1;
            UPGRADES.filter(u => u.category === 'click').forEach(u => p += getLevel(u.key) * u.power);
            return p;
        }
        function getPassiveRate() {
            let r = 0;
            UPGRADES.filter(u => u.category === 'passive').forEach(u => r += getLevel(u.key) * u.power);
            return r;
        }

        function formatNum(n) {
            if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
            if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
            return Math.floor(n).toLocaleString();
        }

        function render() {
            document.getElementById('coinCount').textContent = formatNum(state.coins);
            document.getElementById('gemCount').textContent = formatNum(state.gems);
            document.getElementById('incomeRate').textContent = '+' + formatNum(getPassiveRate()) + '/s';
            document.getElementById('tapGainLabel').textContent = '+' + formatNum(getTapPower() * comboMult);

            const list = document.getElementById('upgradesList');
            list.innerHTML = '';
            const filtered = UPGRADES.filter(u => u.category === currentTab);
            filtered.forEach(u => {
                const cost = getCost(u);
                const canAfford = state.coins >= cost;
                const div = document.createElement('div');
                div.className = 'p-3.5 rounded-2xl border-2 flex items-center justify-between gap-3 ' + 
                    (canAfford ? 'bg-white border-sky-100' : 'bg-slate-50 border-slate-200 opacity-70');
                div.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-black text-sm text-slate-800">${u.name}</span>
                            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-slate-100">Lvl. ${getLevel(u.key)}</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-0.5">${u.desc}</p>
                        <span class="text-xs font-bold ${u.category === 'click' ? 'text-amber-600' : 'text-emerald-600'}">
                            +${formatNum(u.power)} ${u.category === 'click' ? '/tap' : '/sec'}
                        </span>
                    </div>
                    <button class="btn-3d px-4 py-2 rounded-xl text-xs font-black ${canAfford ? (u.category === 'click' ? 'btn-amber text-amber-950' : 'btn-green text-emerald-950') : 'bg-slate-200 text-slate-400 cursor-not-allowed'}" ${canAfford ? '' : 'disabled'}>
                        BUY 🪙 ${formatNum(cost)}
                    </button>
                `;
                div.querySelector('button').onclick = () => {
                    if (state.coins >= cost) {
                        state.coins -= cost;
                        state.levels[u.key] = getLevel(u.key) + 1;
                        playTone(700, 0.2);
                        save();
                        render();
                    }
                };
                list.appendChild(div);
            });
        }

        function save() {
            localStorage.setItem('city_island_standalone', JSON.stringify(state));
        }

        // Tap Island
        document.getElementById('islandBtn').onclick = (e) => {
            comboCount++;
            if (comboCount >= 25) comboMult = 3;
            else if (comboCount >= 10) comboMult = 2;
            else if (comboCount >= 4) comboMult = 1.5;
            else comboMult = 1;

            clearTimeout(comboTimer);
            comboTimer = setTimeout(() => {
                comboCount = 0; comboMult = 1;
                document.getElementById('comboBanner').classList.add('hidden');
                render();
            }, 900);

            if (comboMult > 1) {
                document.getElementById('comboMult').textContent = 'x' + comboMult;
                document.getElementById('comboBanner').classList.remove('hidden');
            }

            const earned = getTapPower() * comboMult;
            state.coins += earned;
            playTone(480 + Math.min(comboCount * 15, 300), 0.08);

            // Floating particle
            const p = document.createElement('div');
            p.className = 'floating-num text-2xl font-black text-amber-500 [text-shadow:0_2px_4px_rgba(180,83,9,0.8)]';
            p.textContent = '+' + formatNum(earned);
            p.style.left = (e.clientX || 200) + 'px';
            p.style.top = (e.clientY || 300) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);

            save();
            render();
        };

        // Tabs
        document.getElementById('tabPassive').onclick = () => {
            currentTab = 'passive';
            document.getElementById('tabPassive').className = 'flex-1 py-2.5 rounded-xl font-black text-sm bg-emerald-500 text-white shadow-md';
            document.getElementById('tabClick').className = 'flex-1 py-2.5 rounded-xl font-black text-sm text-slate-600 hover:bg-white/60';
            render();
        };
        document.getElementById('tabClick').onclick = () => {
            currentTab = 'click';
            document.getElementById('tabClick').className = 'flex-1 py-2.5 rounded-xl font-black text-sm bg-amber-500 text-white shadow-md';
            document.getElementById('tabPassive').className = 'flex-1 py-2.5 rounded-xl font-black text-sm text-slate-600 hover:bg-white/60';
            render();
        };

        // Passive Income Game Loop
        let lastTime = performance.now();
        function loop(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;
            const rate = getPassiveRate();
            if (rate > 0) {
                state.coins += rate * dt;
                document.getElementById('coinCount').textContent = formatNum(state.coins);
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
        setInterval(save, 5000);

        render();
    </script>
</body>
</html>
